type JobStatus @aws_iam
@aws_cognito_user_pools {
	jobId: String!
	patientId: String!
	status: String!
	progress: AWSJSON
	message: String
	result: AWSJSON
	error: String
	updatedAt: String!
	# Bulletin fields (Phase 2)
	bulletinStatus: String
	bulletinSections: AWSJSON
	s3Key: String
	conversionTimeMs: Int
	sectionsConverted: Int
	usedFallback: Boolean
}

type Mutation {
	updateJobStatus(
		jobId: String!,
		patientId: String!,
		status: String!,
		progress: AWSJSON,
		message: String,
		result: AWSJSON,
		error: String,
		bulletinStatus: String,
		bulletinSections: AWSJSON,
		s3Key: String,
		conversionTimeMs: Int,
		sectionsConverted: Int,
		usedFallback: Boolean
	): JobStatus
		@aws_iam
}

type Query {
	getJobStatus(jobId: String!): JobStatus
		@aws_cognito_user_pools
@aws_iam
}

type Subscription {
	onJobStatusChanged(jobId: String!): JobStatus
		@aws_subscribe(mutations: ["updateJobStatus"])
@aws_cognito_user_pools
@aws_iam
}

schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}